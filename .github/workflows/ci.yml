# Dikelola template astria-common (template/service). Ubah di template, lalu render ulang.
# Action dan alat dipin dengan SHA atau checksum (pelajaran insiden Trivy); tidak ada tag mutabel.
name: ci

# Manual only since 2026-11-13: GitHub Actions minutes for the private repos ran out.
# To restore the automatic triggers, uncomment the lines under `on:`.
# Local equivalent (in triase-dfir): pwsh -File scripts/ci-local/ci-local.ps1 <folder>
# On GitHub: gh workflow run ci -R yusronMu77/<repo> --ref <branch>
on:
  # pull_request:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: true
      - name: Akses dependensi privat (astria-common, astria-contracts)
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN || secrets.BOARD_TOKEN }}
        run: git config --global url."https://x-access-token:${DEPS_TOKEN}@github.com/yusronMu77/".insteadOf "https://github.com/yusronMu77/"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" git --redact --no-banner /repo

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        env:
          GH_TOKEN: ${{ secrets.DEPS_TOKEN || secrets.BOARD_TOKEN }}
          DOCKER_BUILDKIT: "1"
        run: docker build --secret id=gh_token,env=GH_TOKEN -t astria-verifier:ci .
      - name: Smoke /ready
        run: |
          docker run -d --name svc -e ASTRIA_ENV=test -p 8000:8000 astria-verifier:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/ready; then exit 0; fi
            sleep 1
          done
          docker logs svc
          exit 1

[project]
name = "astria-verifier"
version = "0.1.0"
description = "Memeriksa klaim narasi terhadap bukti sebelum kartu terbit."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["astria-common[otel]", "astria-contracts"]

[project.scripts]
astria-verifier = "astria_verifier.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "anyio>=4.11",
    "ruff==0.17.4",
]

# Dependensi privat lewat tag git (keputusan pemilik infra#3). Naikkan tag di sini, lalu `uv lock`.
[tool.uv.sources]
astria-common = { git = "https://github.com/yusronMu77/triase-dfir-common", tag = "v0.2.1" }
astria-contracts = { git = "https://github.com/yusronMu77/triase-dfir-contracts", tag = "v0.2.0" }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astria_verifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W", "ASYNC"]
ignore = ["S101", "S104", "ASYNC109"]

[tool.ruff.lint.isort]
known-first-party = ["astria_verifier"]
